# Serves the built SPA, and puts /api on the backend so the browser sees one
# origin. Same-origin means the API needs no CORS, the SPA needs no hostname
# baked in at build time, and the event stream is not a cross-origin request.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change whenever their contents do, so they can be
    # cached hard. index.html must not be, or a deploy would leave browsers on
    # the old app pointing at asset files that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://${SIMLAB_API_HOST}:${SIMLAB_API_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The event stream is a long-lived response. Buffering it turns a live
        # run into one long silence followed by everything at once, and a read
        # timeout severs every watcher on a schedule.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    # Client-side routing: a browser asked to open /runs/abc123 directly
    # requests that path from the server, and without this it would get a 404
    # instead of the app that knows how to render it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
